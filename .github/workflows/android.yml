name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # APK'yı GitHub Release olarak yayınlamak için

env:
  # Mail adresiniz: GitHub > Settings > Secrets and variables > Actions > Variables
  # sekmesinde MAIL_TO adıyla tanımlayın. (Repo herkese açık olduğu için adresi
  # buraya doğrudan yazmıyoruz; yazmak isterseniz ${{ vars.MAIL_TO }} yerine adresi yazın.)
  MAIL_TO: ${{ vars.MAIL_TO }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Arayüzü derle (Vite + Tailwind)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Go testleri
        run: go vet ./... && go test ./...

      - name: Go kütüphanesini derle (gomobile)
        run: |
          go install tool
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          gomobile init
          gomobile bind -target=android/arm64 -androidapi 24 -o android/app/libs/supergym.aar ./mobile

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: APK derle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SuperGym-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SuperGym-${{ github.run_number }}
          path: SuperGym-${{ github.run_number }}.apk

      # Gmail .apk eklerini engellediği için APK Release'e yüklenir, mailde linki gönderilir.
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SuperGym build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message || github.sha }}
          files: SuperGym-${{ github.run_number }}.apk

      - name: Mail gönder
        if: env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: SuperGym <${{ secrets.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          subject: SuperGym yeni APK (build ${{ github.run_number }})
          body: |
            Yeni APK hazır.

            İndir: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/SuperGym-${{ github.run_number }}.apk

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message || github.sha }}
