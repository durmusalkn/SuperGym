plugins {
    id 'com.android.application'
}

// İmza bilgileri GitHub Secrets'tan ortam değişkeni olarak gelir.
def keystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace 'com.supergym.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.supergym.app'
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "0.1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
    }

    signingConfigs {
        // Repodaki sabit anahtar: her APK aynı imzayla çıkar, güncelleme verileri silmez.
        // Gerçek anahtar GitHub Secrets'a eklenince otomatik olarak o kullanılır.
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // gomobile bind ile üretilen Go kütüphanesi (CI'da oluşturulur).
    implementation files('libs/supergym.aar')
}
