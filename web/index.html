<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SuperGym</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
    <main id="view" class="mx-auto max-w-md p-4 pb-40"></main>

    <!-- Dinlenme sayacı ve alt menü -->
    <div class="fixed inset-x-0 bottom-0 z-30">
      <div id="timer"></div>
      <nav id="nav" class="border-t border-zinc-800 bg-zinc-950/95 backdrop-blur"></nav>
    </div>

    <div id="message" class="pointer-events-none fixed inset-x-0 top-0 z-50 p-3"></div>
    <div id="sheet" class="fixed inset-0 z-40 hidden bg-zinc-950"></div>
    <input id="import-file" type="file" accept="application/json,.json" class="hidden" />
  </body>
</html>
